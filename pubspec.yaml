name: bitdrix
description: A modern torrent client with streaming support
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7
  file_picker: ^13.4.1
  path_provider: ^2.1.6
  permission_handler: ^13.0.2
  shared_preferences: ^2.5.6
  dio: ^5.11.1
  uuid: ^4.6.0
  percent_indicator: ^4.2.5

  material_ui: ^1.11.1
dependency_overrides:
  media_kit_video:
    path: third_party/media_kit_video

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
